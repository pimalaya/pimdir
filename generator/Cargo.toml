[package]
name = "pimdir-generator"
description = "Deterministic pimdir histories, the stores they leave and what a conforming implementation answers over them"
version = "0.1.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pimalaya/pimdir"
publish = false

[dependencies]
blake3 = { version = "1", default-features = false }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
